[project]
name = "carib-voices-backend"
version = "0.1.0"
description = "Carib Voices — FastAPI backend + WhatsApp agent + QC worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1,<5",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "boto3>=1.34",
    "pydub>=0.25",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "jiwer>=3.0",
    "webrtcvad>=2.0",
    "faster-whisper>=1.0",
    "redis>=5.0",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
